server.port=5000
spring.application.name=piper-tts

# Leave blank to auto-detect. Override via env vars PIPER_BIN / PIPER_VOICES_DIR
# or command-line: --piper.bin=/path/to/piper --piper.voices.dir=/path/to/voices
piper.bin=
piper.voices.dir=

# Synthesis timeout in seconds
piper.timeout=120

# Suppress Spring Boot startup banner noise
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.dev.piper=INFO
