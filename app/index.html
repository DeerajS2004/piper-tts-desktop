<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piper TTS — EN/JA Edition</title>
  <meta name="description" content="Offline Text-to-Speech for English and Japanese">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ─────────────────────────────────────────────────── */
    :root {
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #21262d;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --primary:   #58a6ff;
      --green:     #3fb950;
      --yellow:    #d29922;
      --red:       #f85149;
      --purple:    #bc8cff;
      --radius:    8px;
      --h-word:    rgba(63,185,80,0.35);
      --h-mark:    rgba(210,153,34,0.30);
      --h-mark-border: #d29922;
    }
    [data-theme="light"] {
      --bg:       #f6f8fa;
      --surface:  #ffffff;
      --surface2: #f0f2f5;
      --border:   #d0d7de;
      --text:     #1f2328;
      --muted:    #656d76;
      --h-word:   rgba(31,136,61,0.25);
      --h-mark:   rgba(154,103,0,0.18);
    }

    /* ── Base ───────────────────────────────────────────────────── */
    html { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background .2s, color .2s;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -.4px;
      white-space: nowrap;
    }
    .logo span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }

    /* Voice selector */
    .voice-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 6px 10px;
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      outline: none;
      min-width: 220px;
      transition: border-color .15s;
    }
    .voice-select:focus { border-color: var(--primary); }

    /* Speed row */
    .speed-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .speed-row label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 130px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 0 0 3px rgba(88,166,255,.2);
      transition: box-shadow .15s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 0 5px rgba(88,166,255,.3);
    }
    #speed-label {
      font-size: 12px;
      color: var(--primary);
      white-space: nowrap;
      min-width: 150px;
      font-variant-numeric: tabular-nums;
    }

    /* Header right */
    .header-right { margin-left: auto; display: flex; gap: 6px; }
    .btn-icon {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      padding: 6px 10px;
      cursor: pointer;
      font-size: 14px;
      transition: all .15s;
    }
    .btn-icon:hover { color: var(--text); border-color: var(--primary); }

    /* ── Progress bar ───────────────────────────────────────────── */
    .progress-wrap {
      height: 3px;
      background: var(--border);
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
    }
    .progress-wrap:hover { height: 5px; margin: -1px 0; }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--purple));
      transition: width .05s linear;
      pointer-events: none;
    }

    /* ── Main text area ─────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 12px 18px 0;
    }
    .text-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    #editor, #reader {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.75;
      padding: 18px 22px;
      overflow-y: auto;
      outline: none;
      resize: none;
      transition: border-color .15s;
    }
    #editor:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(88,166,255,.12); }
    #reader {
      white-space: pre-wrap;
      word-break: break-word;
      cursor: default;
      user-select: text;
    }
    .hidden { display: none !important; }

    /* Word spans */
    .word {
      display: inline;
      border-radius: 3px;
      padding: 1px 0;
      transition: background .08s ease;
    }
    .word.current {
      background: var(--h-word);
      color: #fff;
      font-weight: 500;
      border-radius: 3px;
      padding: 1px 3px;
    }
    [data-theme="light"] .word.current { color: #000; }
    .word.marked {
      background: var(--h-mark);
      border-bottom: 2px solid var(--h-mark-border);
      padding: 1px 3px;
    }
    .word.current.marked {
      background: var(--h-word);
      border-bottom: 2px solid var(--h-mark-border);
    }
    .pre-read { color: var(--muted); opacity: .65; }

    /* Loading overlay */
    .loading-cover {
      position: absolute;
      inset: 0;
      background: rgba(13,17,23,.75);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 10;
      color: var(--text);
      font-size: 14px;
    }
    [data-theme="light"] .loading-cover { background: rgba(255,255,255,.8); }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Stats bar ──────────────────────────────────────────────── */
    .stats-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 5px 18px;
      font-size: 11.5px;
      color: var(--muted);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .stats-bar span { white-space: nowrap; }
    #live-cpm { color: var(--primary); font-weight: 500; }
    #mark-info { color: var(--yellow); }

    /* ── Controls bar ───────────────────────────────────────────── */
    .controls-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .ctrl-sep {
      width: 1px; height: 26px;
      background: var(--border);
      margin: 0 3px;
      flex-shrink: 0;
    }

    /* Buttons */
    button {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 13px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all .15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    button:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--surface);
    }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .38; cursor: not-allowed; }

    #speak-btn {
      background: var(--green);
      border-color: var(--green);
      color: #000;
      font-weight: 600;
    }
    #speak-btn:hover:not(:disabled) {
      background: #4acc5e;
      border-color: #4acc5e;
      color: #000;
    }
    #pause-btn { border-color: var(--yellow); color: var(--yellow); }
    #pause-btn.resuming { border-color: var(--green); color: var(--green); }
    #stop-btn  { border-color: var(--red); color: var(--red); }
    #mark-btn  { border-color: var(--yellow); color: var(--yellow); }
    #mark-btn.active { background: var(--yellow); color: #000; }
    #from-mark-btn { border-color: var(--primary); color: var(--primary); }
    #export-btn { border-color: var(--purple); color: var(--purple); }
    #edit-mode-btn {
      background: var(--surface2);
      border-color: var(--border);
      color: var(--muted);
      font-size: 12px;
      padding: 5px 10px;
    }
    #edit-mode-btn:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }

    /* ── Status bar ─────────────────────────────────────────────── */
    .status-bar {
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 5px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background .2s;
    }
    .dot.playing { background: var(--green); animation: pulse 1.1s ease-in-out infinite; }
    .dot.paused  { background: var(--yellow); }
    .dot.error   { background: var(--red); }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .5; transform: scale(.85); }
    }
    .status-sep { color: var(--border); }
    #status-text { color: var(--text); font-weight: 500; }

    /* Toast notifications */
    #toast {
      position: fixed;
      bottom: 60px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text);
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      z-index: 100;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.warn  { border-color: var(--yellow); color: var(--yellow); }
    #toast.error { border-color: var(--red);    color: var(--red); }
    #toast.ok    { border-color: var(--green);  color: var(--green); }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  </style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────────────── -->
<header class="header">
  <div class="logo">🎤 Piper TTS <span>EN / JA</span></div>

  <select id="voice-select" class="voice-select" title="Select voice">
    <option value="">Loading voices…</option>
  </select>

  <div class="speed-row">
    <label for="speed-slider">Speed</label>
    <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.05" value="1.0">
    <span id="speed-label">1.0× — … CPM</span>
  </div>

  <div class="header-right">
    <button class="btn-icon" id="theme-btn" title="Toggle light/dark">🌙</button>
  </div>
</header>

<!-- ── PROGRESS ───────────────────────────────────────────────── -->
<div class="progress-wrap" id="progress-wrap" title="Click to seek">
  <div id="progress-fill"></div>
</div>

<!-- ── MAIN TEXT AREA ─────────────────────────────────────────── -->
<main class="main">
  <div class="text-wrap" id="text-wrap">
    <textarea id="editor"
      placeholder="Paste or type text here…

Tips:
  • Click Speak to read all text from the beginning
  • Click anywhere → Mark → From Mark to read from any position
  • Marks stay highlighted even while reading
  • From Mark works instantly — no need to stop first"></textarea>

    <div id="reader" class="hidden" aria-live="polite"></div>

    <div id="loading-cover" class="loading-cover hidden">
      <div class="spinner"></div>
      <span id="loading-msg">Generating audio…</span>
    </div>
  </div>
</main>

<!-- ── STATS BAR ──────────────────────────────────────────────── -->
<div class="stats-bar">
  <span id="char-count">0 chars</span>
  <span id="word-count">0 words</span>
  <span id="est-time">Est: —</span>
  <span id="live-cpm"></span>
  <span id="mark-info"></span>
  <span style="margin-left:auto">
    <button id="edit-mode-btn" class="hidden" title="Return to edit mode">✏️ Edit text</button>
  </span>
</div>

<!-- ── CONTROLS BAR ───────────────────────────────────────────── -->
<div class="controls-bar">
  <!-- Playback -->
  <button id="speak-btn"    title="Read all text from beginning (Space)">▶ Speak</button>
  <button id="pause-btn"    title="Pause / Resume (P)" disabled>⏸ Pause</button>
  <button id="stop-btn"     title="Stop reading (Esc)" disabled>⏹ Stop</button>

  <div class="ctrl-sep"></div>

  <!-- Mark controls -->
  <button id="mark-btn"      title="Set bookmark at current position (M)">📍 Mark</button>
  <button id="jump-btn"      title="Scroll to mark (J)" disabled>↩ Jump</button>
  <button id="from-mark-btn" title="Start reading from mark — stops current playback automatically (F)" disabled>▶| From Mark</button>

  <div class="ctrl-sep"></div>

  <!-- Export -->
  <button id="export-btn" title="Download full text as WAV file">💾 Export WAV</button>
</div>

<!-- ── STATUS BAR ─────────────────────────────────────────────── -->
<div class="status-bar">
  <div class="dot" id="status-dot"></div>
  <span id="status-text">Ready</span>
  <span class="status-sep">•</span>
  <span id="status-pos">—</span>
  <span class="status-sep">•</span>
  <span id="status-dur">—</span>
</div>

<!-- Hidden audio player -->
<audio id="audio-player" preload="auto"></audio>

<!-- Toast -->
<div id="toast"></div>

<!-- ── JAVASCRIPT ─────────────────────────────────────────────── -->
<script>
'use strict';

// ── DOM refs ──────────────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const EL = {
  editor:       $('editor'),
  reader:       $('reader'),
  audio:        $('audio-player'),
  voiceSel:     $('voice-select'),
  speedSlider:  $('speed-slider'),
  speedLabel:   $('speed-label'),
  progressWrap: $('progress-wrap'),
  progressFill: $('progress-fill'),
  loadingCover: $('loading-cover'),
  loadingMsg:   $('loading-msg'),
  charCount:    $('char-count'),
  wordCount:    $('word-count'),
  estTime:      $('est-time'),
  liveCPM:      $('live-cpm'),
  markInfo:     $('mark-info'),
  editModeBtn:  $('edit-mode-btn'),
  speakBtn:     $('speak-btn'),
  pauseBtn:     $('pause-btn'),
  stopBtn:      $('stop-btn'),
  markBtn:      $('mark-btn'),
  jumpBtn:      $('jump-btn'),
  fromMarkBtn:  $('from-mark-btn'),
  exportBtn:    $('export-btn'),
  themeBtn:     $('theme-btn'),
  statusDot:    $('status-dot'),
  statusText:   $('status-text'),
  statusPos:    $('status-pos'),
  statusDur:    $('status-dur'),
  toast:        $('toast'),
};

// ── State ─────────────────────────────────────────────────────────────────
const S = {
  voices:          [],
  voice:           null,         // selected voice object
  markChar:        -1,           // bookmark character index (-1 = none)
  isPlaying:       false,
  isPaused:        false,
  timings:         [],           // [{idx,text,start_char,end_char,start_time,end_time}]
  currentIdx:      -1,           // currently highlighted timing index
  startChar:       0,            // where current audio starts in fullText
  fullText:        '',           // text at time of last Speak
  audioDuration:   0,
  actualCPM:       0,
  blobUrl:         null,
};

// Japanese CPM plateaus above ~1.75× based on our benchmarks
const JA_MAX_SPEED_MULT = 1.75;

// ── Init ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadVoices();
  restorePrefs();
  updateStats();
  bindEvents();
  requestAnimationFrame(animLoop);
});

// ── Voice loading ─────────────────────────────────────────────────────────
async function loadVoices() {
  try {
    const r = await fetch('/api/voices');
    S.voices = await r.json();
    EL.voiceSel.innerHTML = S.voices.length
      ? S.voices.map(v => `<option value="${v.id}" data-lang="${v.lang}" data-cpm="${v.cpm_1x}">${v.label}</option>`).join('')
      : '<option value="">No voices found — check install</option>';
    updateSelectedVoice();
    // Restore saved voice
    const saved = localStorage.getItem('pt-voice');
    if (saved) {
      EL.voiceSel.value = saved;
      updateSelectedVoice();
    }
  } catch {
    EL.voiceSel.innerHTML = '<option value="">Server not responding</option>';
  }
}

function updateSelectedVoice() {
  const opt = EL.voiceSel.options[EL.voiceSel.selectedIndex];
  if (opt && opt.value) {
    S.voice = {
      id:     opt.value,
      lang:   opt.dataset.lang || 'en',
      cpm_1x: parseInt(opt.dataset.cpm) || 1160,
    };
  } else {
    S.voice = null;
  }
  updateSpeedLabel();
  updateStats();
}

// ── Speed ─────────────────────────────────────────────────────────────────
function getSpeed() { return parseFloat(EL.speedSlider.value); }

function getCPMEst() {
  if (!S.voice) return 0;
  const spd = getSpeed();
  const base = S.voice.cpm_1x;
  if (S.voice.lang === 'ja' && spd > JA_MAX_SPEED_MULT) {
    return Math.round(base * JA_MAX_SPEED_MULT);
  }
  return Math.round(base * spd);
}

function updateSpeedLabel() {
  const spd = getSpeed();
  const cpm = getCPMEst();
  EL.speedLabel.textContent = `${spd.toFixed(2)}× — ${cpm.toLocaleString()} CPM`;
}

// ── Stats bar ─────────────────────────────────────────────────────────────
function updateStats() {
  const text  = S.isPlaying || S.isPaused ? S.fullText : EL.editor.value;
  const chars = text.length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const cpm   = getCPMEst();
  const secs  = cpm > 0 ? (chars / cpm) * 60 : 0;

  EL.charCount.textContent = `${chars.toLocaleString()} chars`;
  EL.wordCount.textContent = `${words.toLocaleString()} words`;
  EL.estTime.textContent   = secs > 0 ? `Est: ${fmtTime(secs)}` : 'Est: —';
}

function fmtTime(s) {
  if (s < 60) return `${Math.round(s)}s`;
  return `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
}

// ── Speak ─────────────────────────────────────────────────────────────────
async function speak(startChar = 0) {
  if (!S.voice) { toast('Select a voice first', 'warn'); return; }

  const text = EL.editor.value.trim();
  if (!text) { toast('Enter some text first', 'warn'); return; }

  // Stop any current audio (without exiting read mode yet)
  _stopAudio();

  S.fullText  = text;
  S.startChar = startChar;

  showLoading(true, startChar > 0 ? 'Reading from mark…' : 'Generating audio…');

  try {
    const res = await fetch('/api/synthesize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text,
        voice:      S.voice.id,
        speed:      getSpeed(),
        start_char: startChar,
        lang:       S.voice.lang,
      }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Synthesis failed');

    S.timings       = data.timings;
    S.audioDuration = data.duration;
    S.actualCPM     = data.cpm;
    S.currentIdx    = -1;

    // Load audio from base64
    if (S.blobUrl) URL.revokeObjectURL(S.blobUrl);
    const bytes  = b64ToBytes(data.audio);
    const blob   = new Blob([bytes], { type: 'audio/wav' });
    S.blobUrl    = URL.createObjectURL(blob);
    EL.audio.src = S.blobUrl;

    // Build reading view
    buildReader(text, data.timings, startChar);
    enterReadMode();

    // Play
    await EL.audio.play();
    S.isPlaying = true;
    S.isPaused  = false;

    EL.liveCPM.textContent = `Live: ${S.actualCPM.toLocaleString()} CPM`;
    setStatus('playing', `Playing — ${S.actualCPM.toLocaleString()} CPM`,
      startChar > 0 ? `from char ${startChar}` : 'from start', fmtTime(data.duration));
    updateUI();

  } catch (err) {
    toast(`Error: ${err.message}`, 'error');
    setStatus('error', `Error: ${err.message}`);
  } finally {
    showLoading(false);
  }
}

// ── Pause / Resume ────────────────────────────────────────────────────────
function togglePause() {
  if (!S.isPlaying) return;
  if (S.isPaused) {
    EL.audio.play();
    S.isPaused = false;
    setStatus('playing', 'Playing');
    EL.pauseBtn.textContent = '⏸ Pause';
    EL.pauseBtn.classList.remove('resuming');
  } else {
    EL.audio.pause();
    S.isPaused = true;
    const pos = S.currentIdx >= 0 ? S.timings[S.currentIdx]?.start_char ?? S.startChar : S.startChar;
    setStatus('paused', 'Paused', `char ${pos}`);
    EL.pauseBtn.textContent = '▶ Resume';
    EL.pauseBtn.classList.add('resuming');
  }
  updateUI();
}

// ── Stop ──────────────────────────────────────────────────────────────────
function stop(exitRead = true) {
  _stopAudio();
  if (exitRead) exitReadMode();
  clearHighlight();
  updateUI();
  setStatus('', 'Stopped');
}

function _stopAudio() {
  EL.audio.pause();
  try { EL.audio.currentTime = 0; } catch {}
  S.isPlaying = false;
  S.isPaused  = false;
}

// ── Mark ─────────────────────────────────────────────────────────────────
function setMark() {
  let charPos;

  if (S.isPlaying || S.isPaused) {
    // Reading: use the start_char of the currently highlighted word
    if (S.currentIdx >= 0 && S.timings[S.currentIdx]) {
      charPos = S.timings[S.currentIdx].start_char;
    } else {
      charPos = S.startChar;
    }
  } else {
    // Editing: use textarea cursor
    charPos = EL.editor.selectionStart;
  }

  S.markChar = charPos;
  updateMarkHighlight();
  updateUI();
  setMarkInfo(charPos);
  toast(`Mark set at character ${charPos}`, 'ok');
}

function jumpToMark() {
  if (S.markChar < 0) return;

  if (EL.reader.classList.contains('hidden')) {
    // Edit mode: move cursor to mark
    EL.editor.focus();
    EL.editor.setSelectionRange(S.markChar, S.markChar);
    // Scroll textarea to show cursor
    const lineH = parseInt(getComputedStyle(EL.editor).lineHeight);
    const textBefore = EL.editor.value.slice(0, S.markChar);
    const lines = (textBefore.match(/\n/g) || []).length;
    EL.editor.scrollTop = lines * lineH - EL.editor.clientHeight / 2;
  } else {
    // Read mode: scroll reader to marked word
    const el = EL.reader.querySelector('.word.marked') ||
               EL.reader.querySelector(`[data-sc="${S.markChar}"]`);
    if (el) scrollToWord(el);
  }
  toast('Jumped to mark');
}

async function fromMark() {
  if (S.markChar < 0) { toast('Set a mark first (📍 Mark button)', 'warn'); return; }
  // Stop current playback immediately — no manual stop required
  stop(false);
  await speak(S.markChar);
}

// ── Reader DOM ────────────────────────────────────────────────────────────
function buildReader(fullText, timings, startChar) {
  let html = '';

  // Dimmed pre-read text (before startChar)
  if (startChar > 0) {
    html += `<span class="pre-read">${esc(fullText.slice(0, startChar))}</span>`;
  }

  // Build word spans from timing data
  let cursor = startChar;
  for (let i = 0; i < timings.length; i++) {
    const t = timings[i];
    // Gap between words (spaces, newlines)
    if (t.start_char > cursor) {
      html += esc(fullText.slice(cursor, t.start_char));
    }
    const isMarked = S.markChar >= t.start_char && S.markChar < t.end_char;
    html += `<span class="word${isMarked ? ' marked' : ''}" data-idx="${i}" data-sc="${t.start_char}" data-ec="${t.end_char}">${esc(t.text)}</span>`;
    cursor = t.end_char;
  }

  // Remaining unspoken text (trailing content after last word)
  if (cursor < fullText.length) {
    html += `<span class="post-read" style="color:var(--muted);opacity:.5">${esc(fullText.slice(cursor))}</span>`;
  }

  EL.reader.innerHTML = html;
}

function enterReadMode() {
  EL.editor.classList.add('hidden');
  EL.reader.classList.remove('hidden');
  EL.editModeBtn.classList.remove('hidden');
}

function exitReadMode() {
  EL.reader.classList.add('hidden');
  EL.editor.classList.remove('hidden');
  EL.editModeBtn.classList.add('hidden');
  EL.liveCPM.textContent = '';
}

// ── Highlight sync ────────────────────────────────────────────────────────
function syncHighlight() {
  if (!S.isPlaying || S.isPaused || !S.timings.length) return;
  const t   = EL.audio.currentTime;
  const idx = findTiming(t);
  if (idx === S.currentIdx) return;

  // Remove previous
  if (S.currentIdx >= 0) {
    const prev = EL.reader.querySelector(`[data-idx="${S.currentIdx}"]`);
    if (prev) prev.classList.remove('current');
  }
  S.currentIdx = idx;

  if (idx >= 0) {
    const el = EL.reader.querySelector(`[data-idx="${idx}"]`);
    if (el) {
      el.classList.add('current');
      scrollToWord(el);
      // Update position in status bar
      EL.statusPos.textContent = `char ${S.timings[idx].start_char}`;
    }
  }
}

function findTiming(t) {
  // Binary search
  const arr = S.timings;
  if (!arr.length) return -1;
  if (t >= arr[arr.length-1].end_time) return arr.length - 1;
  if (t < arr[0].start_time) return 0;
  let lo = 0, hi = arr.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (arr[mid].start_time <= t) lo = mid;
    else hi = mid - 1;
  }
  return lo;
}

function scrollToWord(el) {
  const c = EL.reader;
  const eTop = el.offsetTop;
  const eBot = eTop + el.offsetHeight;
  const vTop = c.scrollTop;
  const vBot = vTop + c.clientHeight;
  if (eTop < vTop + 60 || eBot > vBot - 60) {
    c.scrollTo({ top: eTop - c.clientHeight * 0.4, behavior: 'smooth' });
  }
}

function clearHighlight() {
  EL.reader.querySelectorAll('.word.current').forEach(el => el.classList.remove('current'));
  S.currentIdx = -1;
}

function updateMarkHighlight() {
  // Update .marked class in reader (if visible)
  EL.reader.querySelectorAll('.word.marked').forEach(el => el.classList.remove('marked'));
  if (S.markChar < 0) return;
  // Find the word that contains markChar
  const el = findWordAtChar(S.markChar);
  if (el) el.classList.add('marked');
}

function findWordAtChar(charPos) {
  for (const t of S.timings) {
    if (t.start_char <= charPos && charPos < t.end_char) {
      return EL.reader.querySelector(`[data-idx="${t.idx}"]`);
    }
  }
  return null;
}

// ── RAF animation loop ────────────────────────────────────────────────────
function animLoop() {
  if (S.isPlaying && !S.isPaused && EL.audio.duration) {
    // Progress bar
    const pct = (EL.audio.currentTime / EL.audio.duration) * 100;
    EL.progressFill.style.width = `${pct}%`;
    // Word sync
    syncHighlight();
    // Remaining time
    const rem = EL.audio.duration - EL.audio.currentTime;
    EL.statusDur.textContent = `−${fmtTime(rem)}`;
  }
  requestAnimationFrame(animLoop);
}

// ── Export WAV ────────────────────────────────────────────────────────────
async function exportWav() {
  if (!S.voice) { toast('Select a voice first', 'warn'); return; }
  const text = EL.editor.value.trim();
  if (!text) { toast('Enter some text first', 'warn'); return; }

  showLoading(true, 'Exporting WAV…');
  try {
    const res = await fetch('/api/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, voice: S.voice.id, speed: getSpeed() }),
    });
    if (!res.ok) {
      const d = await res.json();
      throw new Error(d.error || 'Export failed');
    }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `piper-tts-${Date.now()}.wav`;
    a.click();
    toast('WAV downloaded!', 'ok');
  } catch (err) {
    toast(`Export error: ${err.message}`, 'error');
  } finally {
    showLoading(false);
  }
}

// ── UI state ──────────────────────────────────────────────────────────────
function updateUI() {
  const hasText  = (S.isPlaying ? S.fullText : EL.editor.value).trim().length > 0;
  const hasMark  = S.markChar >= 0;
  const active   = S.isPlaying;
  const paused   = S.isPaused;

  EL.speakBtn.disabled    = !hasText || S.isPlaying;
  EL.pauseBtn.disabled    = !active;
  EL.stopBtn.disabled     = !active;
  EL.markBtn.disabled     = false;
  EL.jumpBtn.disabled     = !hasMark;
  EL.fromMarkBtn.disabled = !hasMark;

  // Pause button text
  if (!active) {
    EL.pauseBtn.textContent = '⏸ Pause';
    EL.pauseBtn.classList.remove('resuming');
  }

  // Mark button active state
  EL.markBtn.classList.toggle('active', hasMark);
}

function setStatus(state, text, pos = null, dur = null) {
  EL.statusDot.className = `dot${state ? ' ' + state : ''}`;
  EL.statusText.textContent = text;
  if (pos !== null) EL.statusPos.textContent = pos;
  if (dur !== null) EL.statusDur.textContent = `~${dur}`;
}

function setMarkInfo(charPos) {
  EL.markInfo.textContent = charPos >= 0 ? `📍 Mark @ char ${charPos}` : '';
}

function showLoading(show, msg = 'Generating audio…') {
  EL.loadingMsg.textContent = msg;
  EL.loadingCover.classList.toggle('hidden', !show);
}

// ── Toast ─────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  clearTimeout(toastTimer);
  EL.toast.textContent = msg;
  EL.toast.className   = `show ${type}`;
  toastTimer = setTimeout(() => { EL.toast.className = ''; }, 2500);
}

// ── Progress seek ─────────────────────────────────────────────────────────
EL.progressWrap.addEventListener('click', e => {
  if (!EL.audio.duration) return;
  const rect = EL.progressWrap.getBoundingClientRect();
  EL.audio.currentTime = ((e.clientX - rect.left) / rect.width) * EL.audio.duration;
});

// ── Audio events ──────────────────────────────────────────────────────────
EL.audio.addEventListener('ended', () => {
  S.isPlaying  = false;
  S.isPaused   = false;
  S.currentIdx = -1;
  EL.progressFill.style.width = '100%';
  clearHighlight();
  setStatus('', 'Done ✓', '—', '0s');
  updateUI();
  toast('Done ✓', 'ok');
  setTimeout(() => { EL.progressFill.style.width = '0%'; }, 2000);
});

EL.audio.addEventListener('error', () => {
  toast('Audio playback error', 'error');
  stop(true);
});

// ── Button events ─────────────────────────────────────────────────────────
EL.speakBtn.addEventListener('click',    () => speak(0));
EL.pauseBtn.addEventListener('click',    togglePause);
EL.stopBtn.addEventListener('click',     () => stop(true));
EL.markBtn.addEventListener('click',     setMark);
EL.jumpBtn.addEventListener('click',     jumpToMark);
EL.fromMarkBtn.addEventListener('click', fromMark);
EL.exportBtn.addEventListener('click',   exportWav);
EL.editModeBtn.addEventListener('click', () => { stop(true); });
EL.voiceSel.addEventListener('change',   () => { updateSelectedVoice(); savePrefs(); });
EL.speedSlider.addEventListener('input', () => { updateSpeedLabel(); updateStats(); savePrefs(); });

EL.themeBtn.addEventListener('click', () => {
  const html = document.documentElement;
  const dark = html.dataset.theme !== 'light';
  html.dataset.theme = dark ? 'light' : 'dark';
  EL.themeBtn.textContent = dark ? '🌙' : '☀️';
  localStorage.setItem('pt-theme', html.dataset.theme);
});

EL.editor.addEventListener('input', () => {
  updateStats();
  localStorage.setItem('pt-text', EL.editor.value);
});

// ── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target === EL.editor) return;   // let user type freely
  switch (e.key) {
    case ' ':
      e.preventDefault();
      if (S.isPlaying) togglePause();
      else speak(0);
      break;
    case 'p': case 'P':
      if (S.isPlaying) togglePause();
      break;
    case 'Escape':
      if (S.isPlaying) stop(true);
      break;
    case 'm': case 'M':
      setMark();
      break;
    case 'j': case 'J':
      jumpToMark();
      break;
    case 'f': case 'F':
      fromMark();
      break;
  }
});

// ── Helpers ───────────────────────────────────────────────────────────────
function esc(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr.buffer;
}

// ── Persistence ───────────────────────────────────────────────────────────
function savePrefs() {
  localStorage.setItem('pt-voice', EL.voiceSel.value);
  localStorage.setItem('pt-speed', EL.speedSlider.value);
}

function restorePrefs() {
  const text  = localStorage.getItem('pt-text');
  const speed = localStorage.getItem('pt-speed');
  const theme = localStorage.getItem('pt-theme');

  if (text)  EL.editor.value = text;
  if (speed) { EL.speedSlider.value = speed; updateSpeedLabel(); }
  if (theme && theme !== 'dark') {
    document.documentElement.dataset.theme = theme;
    EL.themeBtn.textContent = '🌙';
  }
  updateStats();
}
</script>
