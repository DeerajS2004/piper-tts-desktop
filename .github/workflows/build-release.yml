name: Build and Release

# Trigger: push a version tag  →  git tag v1.1.0 && git push --tags
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

# ---------------------------------------------------------------------------
# Voice URLs (verified — HuggingFace main branch)
# ---------------------------------------------------------------------------
env:
  EN_VOICE:    en_US-lessac-medium
  JA_VOICE:    ja_JP-hi_fi_captain-medium
  EN_ONNX_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
  EN_JSON_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
  JA_ONNX_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/ja/ja_JP/hi_fi_captain/medium/ja_JP-hi_fi_captain-medium.onnx
  JA_JSON_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/ja/ja_JP/hi_fi_captain/medium/ja_JP-hi_fi_captain-medium.onnx.json

# ===========================================================================
jobs:
# ===========================================================================

  # -------------------------------------------------------------------------
  # Create the GitHub Release first so both build jobs can upload into it
  # -------------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag:     ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}"         >> $GITHUB_OUTPUT
          echo "version=${TAG#v}"   >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Piper TTS ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ## Piper TTS ${{ steps.tag.outputs.tag }} — EN/JA Edition

            Offline Text-to-Speech for **English** and **Japanese** — no internet required after install.

            ### Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Linux (Debian/Ubuntu) | `piper-tts_*_amd64.deb` | `sudo dpkg -i *.deb && sudo apt-get install -f` |
            | Linux (any distro) | `piper-tts-*-x86_64.AppImage` | `chmod +x *.AppImage && ./piper-tts-*.AppImage` |
            | Windows 10/11 64-bit | `piper-tts.exe` | Double-click to run |

            ### Bundled Voices — works fully offline
            - **English**: `en_US-lessac-medium` (~191 WPM at 1x speed)
            - **Japanese**: `ja_JP-hi_fi_captain-medium`

            > **Windows note**: first launch extracts ~300 MB to a temp folder — this is normal for PyInstaller apps and only happens once per version.

  # -------------------------------------------------------------------------
  # Linux: build .deb  AND  .AppImage  (shares the voice downloads)
  # -------------------------------------------------------------------------
  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget dpkg-dev python3-pip python3-venv \
            python3-tk espeak-ng alsa-utils imagemagick file

      - name: Download voice models
        run: |
          mkdir -p voices
          echo "Downloading English voice..."
          wget -q --show-progress -O voices/${{ env.EN_VOICE }}.onnx      "${{ env.EN_ONNX_URL }}"
          wget -q                  -O voices/${{ env.EN_VOICE }}.onnx.json "${{ env.EN_JSON_URL }}"
          echo "Downloading Japanese voice..."
          wget -q --show-progress -O voices/${{ env.JA_VOICE }}.onnx      "${{ env.JA_ONNX_URL }}"
          wget -q                  -O voices/${{ env.JA_VOICE }}.onnx.json "${{ env.JA_JSON_URL }}"
          ls -lh voices/

      # ------- .deb --------------------------------------------------------
      - name: Build .deb package
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          PKG="piper-tts_${VERSION}_amd64"

          mkdir -p ${PKG}/DEBIAN
          mkdir -p ${PKG}/usr/bin
          mkdir -p ${PKG}/usr/share/piper-tts/app
          mkdir -p ${PKG}/usr/share/piper-tts/voices
          mkdir -p ${PKG}/usr/share/applications
          mkdir -p ${PKG}/usr/share/pixmaps
          mkdir -p ${PKG}/usr/share/doc/piper-tts

          cp app/piper_gui.py              ${PKG}/usr/share/piper-tts/app/
          cp app/piper-icon.png            ${PKG}/usr/share/piper-tts/app/   2>/dev/null || true
          cp app/piper-icon.png            ${PKG}/usr/share/pixmaps/piper-tts.png 2>/dev/null || true
          cp voices/*.onnx voices/*.onnx.json  ${PKG}/usr/share/piper-tts/voices/
          echo "Piper TTS Desktop - MIT License - https://github.com/DeerajS2004/piper-tts-desktop" \
            > ${PKG}/usr/share/doc/piper-tts/copyright

          cat > ${PKG}/usr/bin/piper-tts <<'LAUNCHER'
          #!/bin/bash
          exec /usr/share/piper-tts/venv/bin/python3 /usr/share/piper-tts/app/piper_gui.py "$@"
          LAUNCHER
          chmod 755 ${PKG}/usr/bin/piper-tts

          cat > ${PKG}/usr/share/applications/piper-tts.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Piper TTS
          GenericName=Text-to-Speech
          Comment=Offline Text-to-Speech for English and Japanese
          Exec=/usr/bin/piper-tts
          Icon=/usr/share/pixmaps/piper-tts.png
          Terminal=false
          Categories=AudioVideo;Audio;Utility;Accessibility;
          Keywords=TTS;speech;japanese;english;offline;
          StartupNotify=true
          DESKTOP

          cat > ${PKG}/DEBIAN/control <<CONTROL
          Package: piper-tts
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: DeerajS2004 <deerajs2004@gmail.com>
          Installed-Size: 350000
          Depends: python3 (>= 3.9), python3-venv, python3-pip, python3-tk, espeak-ng, alsa-utils
          Recommends: fonts-noto-cjk
          Section: sound
          Priority: optional
          Homepage: https://github.com/DeerajS2004/piper-tts-desktop
          Description: Offline Text-to-Speech for English and Japanese
           Piper TTS Desktop is a lightweight offline TTS app powered by Piper.
           Supports English (en_US-lessac-medium) and Japanese
           (ja_JP-hi_fi_captain-medium). Both voices are bundled.
          CONTROL

          cat > ${PKG}/DEBIAN/postinst <<'POSTINST'
          #!/bin/bash
          set -e
          case "$1" in
            configure)
              VENV="/usr/share/piper-tts/venv"
              echo "Setting up Python environment (requires internet, ~1 min)..."
              [ -d "$VENV" ] || python3 -m venv "$VENV"
              "$VENV/bin/pip" install --upgrade pip -q
              "$VENV/bin/pip" install "piper-tts>=1.8.0" pyopenjtalk packaging -q
              echo "Piper TTS is ready!"
              ;;
          esac
          POSTINST
          chmod 755 ${PKG}/DEBIAN/postinst

          cat > ${PKG}/DEBIAN/prerm <<'PRERM'
          #!/bin/bash
          set -e
          case "$1" in
            remove|purge) rm -rf /usr/share/piper-tts/venv ;;
          esac
          PRERM
          chmod 755 ${PKG}/DEBIAN/prerm

          dpkg-deb --build --root-owner-group ${PKG}
          ls -lh ${PKG}.deb

      # ------- .AppImage ---------------------------------------------------
      - name: Install Python packages for AppImage
        run: |
          pip3 install "piper-tts>=1.8.0" pyopenjtalk sounddevice soundfile packaging pyinstaller

      - name: Build PyInstaller bundle for AppImage
        run: |
          pyinstaller \
            --name piper-tts \
            --onedir \
            --collect-all pyopenjtalk \
            --collect-all piper \
            --collect-all sounddevice \
            --collect-all soundfile \
            --collect-all onnxruntime \
            --hidden-import tkinter \
            --hidden-import tkinter.ttk \
            --hidden-import tkinter.messagebox \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.scrolledtext \
            app/piper_gui.py

      - name: Assemble AppImage
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"

          # ---- AppDir structure ----
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/voices

          # Copy PyInstaller output
          cp -r dist/piper-tts/*  AppDir/usr/bin/

          # Copy voices (next to app, picked up via APPDIR env var in AppRun)
          cp voices/*.onnx voices/*.onnx.json  AppDir/voices/

          # Icon (convert PNG to required format, fallback if no icon)
          if [ -f app/piper-icon.png ]; then
            cp app/piper-icon.png AppDir/piper-tts.png
            cp app/piper-icon.png AppDir/usr/share/icons/hicolor/256x256/apps/piper-tts.png
          else
            # Generate a minimal placeholder icon
            convert -size 256x256 xc:"#1a1a2e" -fill white \
              -pointsize 48 -gravity center -annotate 0 "TTS" AppDir/piper-tts.png 2>/dev/null || \
              printf '\x89PNG\r\n' > AppDir/piper-tts.png
          fi

          # Desktop entry (must be in AppDir root for appimagetool)
          cat > AppDir/piper-tts.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Piper TTS
          GenericName=Text-to-Speech
          Comment=Offline Text-to-Speech for English and Japanese
          Exec=piper-tts
          Icon=piper-tts
          Terminal=false
          Categories=AudioVideo;Audio;Utility;Accessibility;
          Keywords=TTS;speech;japanese;english;offline;
          DESKTOP
          cp AppDir/piper-tts.desktop AppDir/usr/share/applications/

          # AppRun launcher — sets APPDIR and voices path
          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/bash
          APPDIR="$(dirname "$(readlink -f "$0")")"
          export PIPER_VOICES_DIR="$APPDIR/voices"
          export LD_LIBRARY_PATH="$APPDIR/usr/bin:${LD_LIBRARY_PATH}"
          exec "$APPDIR/usr/bin/piper-tts" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          # Download appimagetool
          wget -q -O appimagetool.AppImage \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool.AppImage

          # Build AppImage (APPIMAGE_EXTRACT_AND_RUN avoids FUSE requirement in CI)
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage AppDir/ \
            "piper-tts-${VERSION}-x86_64.AppImage"

          ls -lh piper-tts-*.AppImage

      - name: Upload Linux assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            *.deb
            piper-tts-*.AppImage

  # -------------------------------------------------------------------------
  # Windows: single self-contained .exe  (voices bundled inside)
  # -------------------------------------------------------------------------
  build-windows-exe:
    needs: create-release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install "piper-tts>=1.8.0" pyopenjtalk sounddevice soundfile packaging
          pip install pyinstaller

      - name: Download voice models
        shell: bash
        run: |
          mkdir -p voices
          echo "Downloading English voice..."
          curl -L --retry 3 -o voices/${{ env.EN_VOICE }}.onnx      "${{ env.EN_ONNX_URL }}"
          curl -L --retry 3 -o voices/${{ env.EN_VOICE }}.onnx.json "${{ env.EN_JSON_URL }}"
          echo "Downloading Japanese voice..."
          curl -L --retry 3 -o voices/${{ env.JA_VOICE }}.onnx      "${{ env.JA_ONNX_URL }}"
          curl -L --retry 3 -o voices/${{ env.JA_VOICE }}.onnx.json "${{ env.JA_JSON_URL }}"
          ls -lh voices/

      - name: Build single .exe with PyInstaller
        shell: bash
        run: |
          # --onefile: everything in one .exe (voices embedded via --add-data)
          # Voices are accessed via sys._MEIPASS at runtime (handled in piper_gui.py)
          pyinstaller \
            --name piper-tts \
            --windowed \
            --onefile \
            --collect-all pyopenjtalk \
            --collect-all piper \
            --collect-all sounddevice \
            --collect-all soundfile \
            --collect-all onnxruntime \
            --hidden-import tkinter \
            --hidden-import tkinter.ttk \
            --hidden-import tkinter.messagebox \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.scrolledtext \
            --add-data "voices;voices" \
            --add-data "app/piper-icon.png;." \
            app/piper_gui.py

          echo "Build complete:"
          ls -lh dist/piper-tts.exe

      - name: Upload single .exe to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/piper-tts.exe
